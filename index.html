<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuimeng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0a0a0b;
        --fg: #e8e4df;
        --fg-dim: #7a7672;
        --accent: #c9a96e;
        --accent-glow: rgba(201, 169, 110, 0.15);
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: 'DM Sans', sans-serif;
        font-weight: 300;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: clamp(2rem, 8vw, 6rem);
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 60% at 20% 50%, var(--accent-glow), transparent),
          radial-gradient(ellipse 50% 80% at 80% 20%, rgba(201, 169, 110, 0.06), transparent);
        pointer-events: none;
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        opacity: 0.6;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .greeting {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(4rem, 10vw, 8rem);
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--fg);
        opacity: 0;
        transform: translateY(30px);
        animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .greeting em {
        font-style: italic;
        color: var(--accent);
      }

      .divider {
        width: 48px;
        height: 1px;
        background: var(--accent);
        margin: 2.5rem 0;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: left;
        animation: lineReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        opacity: 0;
        animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
      }

      .link-item {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--fg-dim);
        text-decoration: none;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: color 0.3s ease, gap 0.3s ease;
        width: fit-content;
      }

      .link-item::before {
        content: '';
        display: block;
        width: 20px;
        height: 1px;
        background: var(--fg-dim);
        transition: width 0.3s ease, background 0.3s ease;
      }

      .link-item:hover {
        color: var(--accent);
        gap: 1rem;
      }

      .link-item:hover::before {
        width: 36px;
        background: var(--accent);
      }

      .corner-mark {
        position: fixed;
        bottom: clamp(1.5rem, 4vw, 3rem);
        right: clamp(1.5rem, 4vw, 3rem);
        font-family: 'Cormorant Garamond', serif;
        font-size: 0.85rem;
        font-style: italic;
        color: var(--fg-dim);
        opacity: 0;
        animation: fadeIn 1s ease 1s forwards;
        z-index: 1;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes lineReveal {
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      @media (max-width: 600px) {
        body {
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1 class="greeting">Hello<em>.</em></h1>
      <div class="divider"></div>
      <nav class="links">
        <a href="https://supabase.wzsmile.cn" class="link-item" target="_blank" rel="noopener">Supabase</a>
      </nav>
    </div>
    <span class="corner-mark">yuimeng</span>
  </body>
</html>
